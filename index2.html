<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo 2026 — Dragões da Real</title>
    <style>
        :root {
            --primary: #C8102E; /* Vermelho Dragões */
            --dark: #121212;
            --light: #F5F5F5;
            --gray: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--light); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1E1E1E; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); }
        h1 { color: var(--primary); font-size: 1.5rem; margin: 10px 0; }
        h2 { font-size: 1.1rem; color: #ddd; border-bottom: 1px solid #444; padding-bottom: 5px; margin-top: 25px; }
        
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; background: #2C2C2C; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .checkbox-item { background: #2C2C2C; padding: 10px; border-radius: 5px; flex: 1 1 40%; border: 1px solid #444; cursor: pointer; }
        .checkbox-item input { width: auto; margin-right: 5px; }
        
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 5px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 30px; transition: 0.3s; }
        button:hover { background: #A00D24; }
        
        .hidden { display: none; }
        .success { text-align: center; padding: 40px; }
        .success h2 { color: #4CAF50; border: none; }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <div class="header">
        <!-- Logo placeholder - substitua pela URL real se tiver -->
        <img src="./index_files/logo.png" alt="Logo Dragões" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Question_mark_alternative.svg/1200px-Question_mark_alternative.svg.png'">
        <h1>Dragões da Real</h1>
        <p>Censo Carnaval 2026</p>
    </div>

    <form id="censoForm">
        <!-- I. Identificação -->
        <h2>I. Identificação</h2>
        <label>Nome Completo *</label>
        <input type="text" name="nome" required placeholder="Seu nome completo">
        
        <label>WhatsApp *</label>
        <input type="tel" name="whatsapp" required placeholder="(11) 99999-9999">
        
        <label>Gênero *</label>
        <select name="genero" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="Feminino">Feminino</option>
            <option value="Masculino">Masculino</option>
            <option value="Não-binário">Não-binário</option>
            <option value="Outro">Outro</option>
            <option value="Prefiro não informar">Prefiro não informar</option>
        </select>
        
        <label>Data de Nascimento *</label>
        <input type="date" name="nascimento" required>

        <!-- II. Vínculo -->
        <h2>II. Vínculo com a Escola</h2>
        <label>Ano de Entrada *</label>
        <select name="ano_entrada" required>
            <option value="" disabled selected>Selecione o ano...</option>
            <option value="2026">2026 (Novo)</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <!-- Adicione mais anos se necessário -->
        </select>

        <label>Departamento / Ala *</label>
        <select name="departamento" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="Comissão de Frente">Comissão de Frente</option>
            <option value="Dep. Casais">Dep. Casais</option>
            <option value="Destaque de Chão">Destaque de Chão</option>
            <option value="Composição">Composição</option>
            <option value="Destaques">Destaques</option>
            <option value="Diretoria">Diretoria</option>
            <option value="Harmonia">Harmonia</option>
            <option value="Ala Carnareal">Ala Carnareal</option>
            <option value="Ala Comunidade">Ala Comunidade</option>
            <option value="Bateria">Bateria</option>
            <option value="Ala Guardiões">Ala Guardiões</option>
            <option value="Ala Baianas">Ala Baianas</option>
            <option value="Ala Jovens">Ala Jovens</option>
            <option value="Ala Zona Sul">Ala Zona Sul</option>
            <option value="Ala Pirituba">Ala Pirituba</option>
            <option value="Ala Oz">Ala Oz</option>
            <option value="Ala Atibaia">Ala Atibaia</option>
            <option value="Ala Caverna">Ala Caverna</option>
            <option value="Ala Amigos da Vila">Ala Amigos da Vila</option>
            <option value="Ala Explosão">Ala Explosão</option>
            <option value="Ala Tamujuntu">Ala Tamujuntu</option>
            <option value="Ala Avalanche">Ala Avalanche</option>
            <option value="Ala Portal">Ala Portal</option>
            <option value="Ala Sítio">Ala Sítio</option>
            <option value="Ala Anastácio">Ala Anastácio</option>
            <option value="Ala Ziriguidum">Ala Ziriguidum</option>
            <option value="Ala Passistas">Ala Passistas</option>
            <option value="Ala Convidados">Ala Convidados</option>
        </select>

        <label>Função no Casal (Se aplicável)</label>
        <select name="funcao_casal">
            <option value="">Não se aplica</option>
            <option value="Mestre-Sala">Mestre-Sala</option>
            <option value="Porta-Bandeira">Porta-Bandeira</option>
            <option value="Apresentador(a)">Apresentador(a)</option>
        </select>

        <label>Naipe na Bateria (Se aplicável)</label>
        <select name="naipe_bateria">
            <option value="">Não se aplica</option>
            <option value="Surdo">Surdo</option>
            <option value="Caixa">Caixa</option>
            <option value="Tamborim">Tamborim</option>
            <option value="Repinique">Repinique</option>
            <option value="Agogô">Agogô</option>
            <option value="Chocalho">Chocalho</option>
            <option value="Cuíca">Cuíca</option>
            <option value="Outro">Outro</option>
        </select>

        <label>Carteirinha da Escola *</label>
        <select name="carteirinha" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="Sim, tenho">Sim, tenho</option>
            <option value="Não tenho, mas quero">Não tenho, mas quero</option>
            <option value="Não tenho interesse">Não tenho interesse</option>
        </select>

        <!-- III. Logística -->
        <h2>III. Logística e Disponibilidade</h2>
        <label>Chance de Desfilar em 2026 *</label>
        <select name="chance_desfile" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="100%">100% (Certo)</option>
            <option value="75%">75% (Provável)</option>
            <option value="50%">50% (Talvez)</option>
            <option value="25%">25% (Difícil)</option>
            <option value="0%">0% (Não vou)</option>
        </select>

        <label>Cidade *</label>
        <input type="text" name="cidade" required placeholder="São Paulo">

        <label>Zona *</label>
        <select name="zona" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="Zona Norte">Zona Norte</option>
            <option value="Zona Sul">Zona Sul</option>
            <option value="Zona Leste">Zona Leste</option>
            <option value="Zona Oeste">Zona Oeste</option>
            <option value="Centro">Centro</option>
            <option value="Grande São Paulo">Grande São Paulo</option>
            <option value="Outro Estado">Outro Estado</option>
        </select>

        <label>Dias Disponíveis para Ensaio *</label>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="dias[]" value="Seg"> Seg</label>
            <label class="checkbox-item"><input type="checkbox" name="dias[]" value="Ter"> Ter</label>
            <label class="checkbox-item"><input type="checkbox" name="dias[]" value="Qua"> Qua</label>
            <label class="checkbox-item"><input type="checkbox" name="dias[]" value="Qui"> Qui</label>
            <label class="checkbox-item"><input type="checkbox" name="dias[]" value="Sex"> Sex</label>
            <label class="checkbox-item"><input type="checkbox" name="dias[]" value="Sáb"> Sáb</label>
            <label class="checkbox-item"><input type="checkbox" name="dias[]" value="Dom"> Dom</label>
        </div>

        <!-- IV. Desenvolvimento -->
        <h2>IV. Desenvolvimento</h2>
        <label>Interesses (Opcional)</label>
        <p style="font-size: 0.8rem; color: #aaa; margin-top: 0;">O que você gostaria de fazer na escola?</p>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="interesses[]" value="Aprender mais"> Aprender mais sobre Carnaval</label>
            <label class="checkbox-item"><input type="checkbox" name="interesses[]" value="Ser Coordenador"> Ser Coordenador de Ala</label>
            <label class="checkbox-item"><input type="checkbox" name="interesses[]" value="Participar Harmonia"> Participar da Harmonia</label>
            <label class="checkbox-item"><input type="checkbox" name="interesses[]" value="Integrar Ala Cênica"> Integrar Ala Cênica/Coreografada</label>
        </div>

        <button type="submit">Enviar meu Censo</button>
    </form>
</div>

<div class="container hidden" id="success-container">
    <div class="success">
        <img src="./index_files/logo.png" alt="Logo" style="width: 80px; border-radius: 50%;" onerror="this.style.display='none'">
        <h2>Obrigado!</h2>
        <p>Sua participação no Censo 2026 foi registrada com sucesso.</p>
        <p style="color: #888; font-size: 0.9rem;">Dragões da Real — Uma vida de amor ao samba!</p>
        <button onclick="location.reload()">Enviar outro</button>
    </div>
</div>

<script>
    // CONFIGURAÇÃO: Cole aqui a URL do seu Google Apps Script
    const SCRIPT_URL = 'SUA_URL_DO_GOOGLE_SCRIPT_AQUI';

    document.getElementById('censoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        btn.textContent = 'Enviando...';
        btn.disabled = true;

        const formData = new FormData(this);
        
        // Converte checkboxes para string
        const dias = formData.getAll('dias[]');
        const interesses = formData.getAll('interesses[]');
        
        // Prepara dados para envio
        const data = {
            nome: formData.get('nome'),
            whatsapp: formData.get('whatsapp'),
            genero: formData.get('genero'),
            nascimento: formData.get('nascimento'),
            ano_entrada: formData.get('ano_entrada'),
            departamento: formData.get('departamento'),
            funcao_casal: formData.get('funcao_casal'),
            naipe_bateria: formData.get('naipe_bateria'),
            carteirinha: formData.get('carteirinha'),
            chance_desfile: formData.get('chance_desfile'),
            cidade: formData.get('cidade'),
            zona: formData.get('zona'),
            dias: dias.join(', '),
            interesses: interesses.join(', ') // Aqui está o campo Interesses!
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('success-container').classList.remove('hidden');
        }).catch(err => {
            alert('Erro ao enviar. Tente novamente.');
            btn.textContent = 'Enviar meu Censo';
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
