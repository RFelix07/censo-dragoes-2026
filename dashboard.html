<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="FBT2xWJVqhPJ4mXP5nfuMhhU1-PddgeCjm5ViwyDchM" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Censo 2027 — Dragões da Real</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --creme:#F2EAD8;--creme-brd:#D8C8A8;--creme-txt:#8B6040;
  --branco:#FFFFFF;--preto:#1A0A00;--vermelho:#C8102E;--verm-esc:#8B0015;
  --verm-bg:#FFF0EE;--dourado:#D4A843;--dour-esc:#A07820;
  --borda:#E0D0B8;--txt:#1A0A00;--txt-sec:#6B5040;--txt-hint:#B0A090;
  --verde:#2D6A3A;--verde-bg:#E8F5EE;--bg:#F7F4EF;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:var(--creme);border-bottom:1px solid var(--creme-brd);position:sticky;top:0;z-index:100}
.topbar-stripe{display:flex;height:4px}
.topbar-stripe span{flex:1}
.topbar-body{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{width:32px;height:32px;object-fit:contain}
.topbar-title{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--preto);line-height:1.1}
.topbar-title small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--creme-txt)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-time{font-size:11px;color:var(--txt-hint);font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px}
.btn-atualizar{background:transparent;border:1px solid var(--creme-brd);border-radius:4px;color:var(--creme-txt);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;cursor:pointer;transition:all .2s}
.btn-atualizar:hover{background:var(--creme);border-color:var(--creme-txt)}
.btn-atualizar.spin span{display:inline-block;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── TABS ── */
.tabs-wrap{background:var(--branco);border-bottom:1px solid var(--borda);position:sticky;top:60px;z-index:99}
.tabs{display:flex;max-width:1100px;margin:0 auto;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-hint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;user-select:none}
.tab:hover{color:var(--txt-sec)}
.tab.ativo{color:var(--vermelho);border-bottom-color:var(--vermelho)}

/* ── MAIN ─ */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.tab-content{display:none}
.tab-content.ativo{display:block}

/* ── ALERT ── */
.alert-banner{background:var(--creme);border:1px solid var(--creme-brd);border-left:3px solid var(--dourado);border-radius:4px;padding:10px 14px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--creme-txt)}
.alert-banner a{color:var(--vermelho);font-weight:600;text-decoration:none}

/* ── SECTION LABEL ── */
.sec-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--creme-txt);margin-bottom:12px;margin-top:24px;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--borda)}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--branco);border:1px solid var(--borda);border-top:2px solid var(--borda);border-radius:4px;padding:14px 14px}
.kpi.red{border-top-color:var(--vermelho)}
.kpi.gold{border-top-color:var(--dourado)}
.kpi.green{border-top-color:var(--verde)}
.kpi.dark{border-top-color:var(--preto)}
.kpi-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-hint);margin-bottom:5px}
.kpi-val{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1;color:var(--txt)}
.kpi-val.red{color:var(--vermelho)}
.kpi-val.gold{color:var(--dour-esc)}
.kpi-val.green{color:var(--verde)}
.kpi-sub{font-size:11px;color:var(--txt-hint);margin-top:3px}

/* ── ACCORDION ── */
.acc-list{display:flex;flex-direction:column;gap:6px}
.acc-item{background:var(--branco);border:1px solid var(--borda);border-radius:4px;overflow:hidden}
.acc-item.aberto{border-color:var(--creme-brd)}
.acc-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;transition:background .15s}
.acc-hdr:hover{background:var(--creme)}
.acc-item.aberto .acc-hdr{background:var(--creme);border-bottom:1px solid var(--borda)}
.acc-hdr-left{display:flex;align-items:center;gap:10px}
.acc-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.acc-nome{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--txt)}
.acc-hdr-right{display:flex;align-items:center;gap:10px}
.acc-pct-badge{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 10px;border-radius:3px;border:1px solid}
.acc-pct-badge.green{background:var(--verde-bg);color:var(--verde);border-color:rgba(45,106,58,.2)}
.acc-pct-badge.yellow{background:#FDF6E3;color:var(--dour-esc);border-color:rgba(160,120,32,.2)}
.acc-pct-badge.red{background:var(--verm-bg);color:var(--vermelho);border-color:rgba(200,16,46,.2)}
.acc-pct-badge.purple{background:#F3E8FF;color:#7B3F9E;border-color:rgba(123,63,158,.2)}
.acc-pct-badge.blue{background:#EFF6FF;color:#3B82F6;border-color:rgba(59,130,246,.2)}
.dep-prog-fill.purple{background:#7B3F9E}
.dep-prog-fill.blue{background:#3B82F6}
.acc-chevron{font-size:13px;color:var(--txt-hint);transition:transform .3s}
.acc-item.aberto .acc-chevron{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.acc-item.aberto .acc-body{max-height:1000px}
.acc-inner{padding:14px 16px}

/* Barra de progresso dentro do accordion */
.dep-prog{margin-bottom:14px}
.dep-prog-hdr{display:flex;justify-content:space-between;margin-bottom:6px}
.dep-prog-txt{font-size:12px;color:var(--txt-sec)}
.dep-prog-pct{font-family:'Playfair Display',serif;font-size:14px;font-weight:700}
.dep-prog-track{height:5px;background:var(--borda);border-radius:3px;overflow:hidden}
.dep-prog-fill{height:100%;border-radius:3px;transition:width 1s ease}
.dep-prog-fill.green{background:var(--verde)}
.dep-prog-fill.yellow{background:var(--dourado)}
.dep-prog-fill.red{background:var(--vermelho)}

/* Naipes dentro do accordion da bateria */
.naipes-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.naipe-box{background:var(--bg);border:1px solid var(--borda);border-radius:3px;padding:8px;text-align:center}
.naipe-num{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--vermelho)}
.naipe-lbl{font-size:10px;color:var(--txt-hint);margin-top:1px}

/* Casal dentro do accordion */
.funcoes-inner{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.funcao-box{background:var(--bg);border:1px solid var(--borda);border-radius:3px;padding:8px;text-align:center}
.funcao-num{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--preto)}
.funcao-lbl{font-size:10px;color:var(--txt-hint);margin-top:1px}

/* ── ALERTAS ── */
.alert-list{display:flex;flex-direction:column;gap:6px}
.alert-item{display:flex;align-items:center;gap:12px;background:var(--branco);border:1px solid var(--borda);border-left:3px solid var(--borda);border-radius:4px;padding:11px 14px}
.alert-item.red{border-left-color:var(--vermelho)}
.alert-item.yellow{border-left-color:var(--dourado)}
.alert-item.green{border-left-color:var(--verde)}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-dot.red{background:var(--vermelho)}
.alert-dot.yellow{background:var(--dourado)}
.alert-dot.green{background:var(--verde)}
.alert-txt{font-size:13px;flex:1;color:var(--txt-sec)}
.alert-txt strong{color:var(--txt);font-weight:600}
.alert-btn{background:transparent;border:1px solid var(--borda);border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--vermelho);padding:3px 10px;cursor:pointer;transition:all .2s;white-space:nowrap}
.alert-btn:hover{background:var(--verm-bg);border-color:rgba(200,16,46,.3)}

/* ── ANÁLISES (aba 3) ── */
.charts-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.charts-grid{grid-template-columns:1fr 1fr}}
.chart-card{background:var(--branco);border:1px solid var(--borda);border-radius:4px;padding:16px}
.chart-ttl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-hint);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--borda)}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;flex:1}
.leg-item{display:flex;align-items:center;gap:8px;font-size:12px}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.leg-lbl{flex:1;color:var(--txt-sec)}
.leg-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--txt);font-size:13px}

/* Barras */
.bar-list{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-lbl{font-size:11px;color:var(--txt-sec);width:40px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:6px;background:var(--borda);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width 1.2s ease}
.bar-num{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--txt);width:28px}

/* Dias */
.dias-bars{display:flex;align-items:flex-end;justify-content:space-between;gap:5px;height:80px;margin-bottom:8px}
.dia-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.dia-bar{width:100%;background:var(--vermelho);min-height:4px;border-radius:2px 2px 0 0;transition:height 1.2s ease}
.dia-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--txt-hint);letter-spacing:.5px}
.dia-num{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--vermelho)}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:500px){.stats-row{grid-template-columns:repeat(4,1fr)}}
.stat-item{background:var(--branco);border:1px solid var(--borda);border-radius:4px;padding:12px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--preto)}
.stat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt-hint);margin-top:2px}

/* ── EMPTY ── */
.empty{text-align:center;padding:32px 20px;color:var(--txt-hint)}
.empty-icon{font-size:28px;margin-bottom:8px}
.empty-txt{font-size:13px}

/* ── MODAL CONFIG ── */
.modal-ov{position:fixed;inset:0;background:rgba(26,10,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--branco);border:1px solid var(--borda);border-top:3px solid var(--dourado);border-radius:4px;padding:28px;width:100%;max-width:480px}
.modal h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;margin-bottom:6px;color:var(--preto)}
.modal p{font-size:13px;color:var(--txt-sec);margin-bottom:18px;line-height:1.5}
.modal input{width:100%;background:var(--bg);border:1px solid var(--borda);border-left:3px solid var(--vermelho);border-radius:4px;color:var(--preto);font-family:'Barlow',sans-serif;font-size:14px;padding:11px 13px;outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--dourado)}
.modal-btns{display:flex;gap:10px}
.btn-p{flex:1;background:var(--preto);border:none;border-bottom:2px solid var(--dour-esc);border-radius:4px;color:var(--dourado);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:12px;cursor:pointer;transition:all .2s}
.btn-p:hover{background:#2A1000}
.btn-s{background:transparent;border:1px solid var(--borda);border-radius:4px;color:var(--txt-sec);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;padding:12px 18px;cursor:pointer;transition:all .2s}
.btn-s:hover{border-color:var(--preto);color:var(--preto)}
.cfg-note{background:var(--creme);border:1px solid var(--creme-brd);border-left:3px solid var(--dourado);border-radius:4px;padding:10px 13px;font-size:11px;color:var(--creme-txt);line-height:1.5;margin-bottom:16px}
.cfg-note strong{color:var(--preto)}

/* ── LOADING ── */
.loading-ov{position:fixed;inset:0;background:rgba(247,244,239,.92);display:flex;align-items:center;justify-content:center;z-index:300}
.loading-box{text-align:center}
.loading-logo{width:48px;height:48px;animation:float 1.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.loading-txt{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--creme-txt);margin-top:14px}

/* ── EXPORT CSV BTN ── */
.cart-table{width:100%;border-collapse:collapse;font-size:13px}
.cart-table th{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-hint);padding:8px 10px;text-align:left;border-bottom:2px solid var(--borda);background:var(--creme)}
.cart-table td{padding:9px 10px;border-bottom:1px solid var(--borda);color:var(--txt-sec);vertical-align:middle}
.cart-table tr:last-child td{border-bottom:none}
.cart-table tr:hover td{background:var(--bg)}
.cart-table .td-nome{font-weight:600;color:var(--txt)}
.cart-table .td-tel a{color:var(--vermelho);text-decoration:none;font-weight:600}

.btn-export{background:transparent;border:1px solid var(--borda);border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dour-esc);padding:4px 12px;cursor:pointer;transition:all .2s}
.btn-export:hover{background:var(--creme);border-color:var(--dourado)}
</style>
</head>
