<!DOCTYPE html>
<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="google-site-verification" content="FBT2xWJVqhPJ4mXP5nfuMhhU1-PddgeCjm5ViwyDchM">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Censo 2027 — Dragões da Real</title>
<link href="./dashboard_files/css2" rel="stylesheet">
<style>
:root{
  --creme:#F2EAD8;--creme-brd:#D8C8A8;--creme-txt:#8B6040;
  --branco:#FFFFFF;--preto:#1A0A00;--vermelho:#C8102E;--verm-esc:#8B0015;
  --verm-bg:#FFF0EE;--dourado:#D4A843;--dour-esc:#A07820;
  --borda:#E0D0B8;--txt:#1A0A00;--txt-sec:#6B5040;--txt-hint:#B0A090;
  --verde:#2D6A3A;--verde-bg:#E8F5EE;--bg:#F7F4EF;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:var(--creme);border-bottom:1px solid var(--creme-brd);position:sticky;top:0;z-index:100}
.topbar-stripe{display:flex;height:4px}
.topbar-stripe span{flex:1}
.topbar-body{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{width:32px;height:32px;object-fit:contain}
.topbar-title{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:var(--preto);line-height:1.1}
.topbar-title small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--creme-txt)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-time{font-size:11px;color:var(--txt-hint);font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px}
.btn-atualizar{background:transparent;border:1px solid var(--creme-brd);border-radius:4px;color:var(--creme-txt);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;cursor:pointer;transition:all .2s}
.btn-atualizar:hover{background:var(--creme);border-color:var(--creme-txt)}
.btn-atualizar.spin span{display:inline-block;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── TABS ── */
.tabs-wrap{background:var(--branco);border-bottom:1px solid var(--borda);position:sticky;top:60px;z-index:99}
.tabs{display:flex;max-width:1100px;margin:0 auto;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-hint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;user-select:none}
.tab:hover{color:var(--txt-sec)}
.tab.ativo{color:var(--vermelho);border-bottom-color:var(--vermelho)}

/* ── MAIN ── */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.tab-content{display:none}
.tab-content.ativo{display:block}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--branco);border:1px solid var(--borda);border-top:2px solid var(--borda);border-radius:4px;padding:14px 14px}
.kpi.red{border-top-color:var(--vermelho)}
.kpi.gold{border-top-color:var(--dourado)}
.kpi.green{border-top-color:var(--verde)}
.kpi.dark{border-top-color:var(--preto)}
.kpi-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-hint);margin-bottom:5px}
.kpi-val{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,30px);font-weight:900;line-height:1;color:var(--txt)}
.kpi-val.red{color:var(--vermelho)}
.kpi-val.gold{color:var(--dour-esc)}
.kpi-val.green{color:var(--verde)}
.kpi-sub{font-size:11px;color:var(--txt-hint);margin-top:3px}

/* ── ABANDONO BOX ── */
.aba-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:500px){.aba-grid{grid-template-columns:repeat(3,1fr)}}
.aba-card{background:var(--branco);border:1px solid var(--borda);border-radius:4px;padding:14px;text-align:center}

/* ── CONFIG MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(26,10,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--branco);border:1px solid var(--borda);border-top:3px solid var(--dourado);border-radius:4px;padding:28px;width:100%;max-width:480px}
.modal h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;margin-bottom:6px;color:var(--preto)}
.modal p{font-size:13px;color:var(--txt-sec);margin-bottom:18px;line-height:1.5}
.modal input{width:100%;background:var(--bg);border:1px solid var(--borda);border-left:3px solid var(--vermelho);border-radius:4px;color:var(--preto);font-family:'Barlow',sans-serif;font-size:14px;padding:11px 13px;outline:none;margin-bottom:12px}
.modal-btns{display:flex;gap:10px}
.btn-p{flex:1;background:var(--preto);border:none;border-bottom:2px solid var(--dour-esc);border-radius:4px;color:var(--dourado);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:12px;cursor:pointer;transition:all .2s}
.btn-s{background:transparent;border:1px solid var(--borda);border-radius:4px;color:var(--txt-sec);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;padding:12px 18px;cursor:pointer;transition:all .2s}

/* ── LOADING ── */
.loading-ov{position:fixed;inset:0;background:rgba(247,244,239,.92);display:flex;align-items:center;justify-content:center;z-index:300}
.loading-box{text-align:center}
.loading-txt{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--creme-txt);margin-top:14px}
</style>
</head>
<body>

<div class="loading-ov" id="loadingOv" style="display: none;">
  <div class="loading-box">
    <div class="loading-txt">Carregando dados...</div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-stripe">
    <span style="background:#C8102E"></span><span style="background:#1A0A00"></span>
    <span style="background:#D4A843"></span><span style="background:#1A0A00"></span>
  </div>
  <div class="topbar-body">
    <div class="topbar-left">
      <div class="topbar-title">
        Dragões da Real
        <small>Censo 2027 · Funnel Mng</small>
      </div>
    </div>
    <div class="topbar-right">
      <span class="topbar-time" id="lastUpdate">Atualizado agora</span>
      <button class="btn-atualizar" id="btnAtualizar" onclick="updateData()">
        <span>↻</span> Sincronizar
      </button>
    </div>
  </div>
</header>

<main class="main">
  <div id="dashboardContent">
    </div>
</main>

<script>
const CONFIG = {
  url: "https://script.google.com/macros/s/AKfycbzcwh2WEbpCnLwSntDJ94EdxnfkzNxc47leOU9iKrTBaiL3SVhm3KRzMGYNn1dMN415yg/exec"
};

let allData = [];

async function updateData() {
  const btn = document.querySelector('.btn-atualizar');
  if (btn.classList.contains('spin')) return;
  
  btn.classList.add('spin');
  try {
    // LINHA CORRIGIDA ABAIXO:
    const res = await fetch(`${CONFIG.url}?action=getData`);
    const json = await res.json();
    
    if (json.status === 'success') {
      allData = json.data;
      renderDashboard();
    } else {
      alert('Erro na resposta do servidor.');
    }
  } catch (e) {
    console.error(e);
    alert('Erro ao conectar com o Apps Script.');
  } finally {
    btn.classList.remove('spin');
    document.getElementById('lastUpdate').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }
}

function renderDashboard() {
  const el = document.getElementById('dashboardContent');
  if (!allData || allData.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--txt-hint)">Nenhum dado encontrado no funil.</div>';
    return;
  }

  // Lógica de cálculo dos cartões baseada nos dados recebidos
  let iniciados = allData.length;
  let concluidos = allData.filter(r => r.status === 'Concluído' || r.step === 'Finalizado').length;
  let abandonos = iniciados - concluidos;
  let taxaConversao = iniciados > 0 ? Math.round((concluidos / iniciados) * 100) : 0;

  // Separação de abandonos por etapas (Passo 1, Passo 2, Passo 3)
  let p1 = allData.filter(r => r.step === 'Passo 1' && r.status !== 'Concluído').length;
  let p2 = allData.filter(r => r.step === 'Passo 2' && r.status !== 'Concluído').length;
  let p3 = allData.filter(r => r.step === 'Passo 3' && r.status !== 'Concluído').length;

  let html = `
    <div class="kpi-grid">
      <div class="kpi dark"><div class="kpi-lbl">Formulários Iniciados</div><div class="kpi-val">${iniciados}</div><div class="kpi-sub">Cliques no link</div></div>
      <div class="kpi green"><div class="kpi-lbl">Envios Concluídos</div><div class="kpi-val green">${concluidos}</div><div class="kpi-sub">Chegaram até o fim</div></div>
      <div class="kpi red"><div class="kpi-lbl">Abandonos Totais</div><div class="kpi-val red">${abandonos}</div><div class="kpi-sub">Ficaram pelo caminho</div></div>
      <div class="kpi gold"><div class="kpi-lbl">Taxa de Conversão</div><div class="kpi-val gold">${taxaConversao}%</div><div class="kpi-sub">Aproveitamento total</div></div>
    </div>

    <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--creme-txt);margin-bottom:12px;margin-top:24px;display:flex;align-items:center;gap:10px">Onde os componentes estão parando?<span style="flex:1;height:1px;background:var(--borda)"></span></div>

    <div class="aba-grid">
      <div class="aba-card">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-hint);margin-bottom:4px">Passo 1 — Identificação</div>
        <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--vermelho)">${p1}</div>
        <div style="font-size:11px;color:var(--txt-hint);margin-top:2px">${abandonos > 0 ? Math.round((p1/abandonos)*100) : 0}% dos abandonos</div>
      </div>
      <div class="aba-card">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-hint);margin-bottom:4px">Passo 2 — Ala e Contato</div>
        <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--vermelho)">${p2}</div>
        <div style="font-size:11px;color:var(--txt-hint);margin-top:2px">${abandonos > 0 ? Math.round((p2/abandonos)*100) : 0}% dos abandonos</div>
      </div>
      <div class="aba-card">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--txt-hint);margin-bottom:4px">Passo 3 — Questionário</div>
        <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--vermelho)">${p3}</div>
        <div style="font-size:11px;color:var(--txt-hint);margin-top:2px">${abandonos > 0 ? Math.round((p3/abandonos)*100) : 0}% dos abandonos</div>
      </div>
    </div>
    <div style="font-size:12px;color:var(--txt-hint);text-align:center;padding:8px;background:var(--creme);border-radius:4px;margin-top:16px">Total de formulários pendentes: <strong style="color:var(--preto)">${abandonos}</strong></div>
  `;

  el.innerHTML = html;
}

window.addEventListener('load', () => {
  updateData();
});
</script>
</body></html>
